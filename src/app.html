<title>Bud Jet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone = large-title pages + glass tab bar + bottom sheet; desktop (>=900px) = glass sidebar + two-column grid + centered sheet. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F6F6F9; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --fg:#0B0B0F; --fg2:rgba(60,60,67,.64); --fg3:rgba(60,60,67,.34); --sep:rgba(60,60,67,.13);
  --accent:#0A66FF; --accent-ink:#FFFFFF; --accent-soft:rgba(10,102,255,.10);
  --green:#17A158; --green-soft:rgba(23,161,88,.12); --red:#E0403F; --red-soft:rgba(224,64,63,.10);
  --orange:#E07B00; --orange-soft:rgba(224,123,0,.12);
  --glass:rgba(246,246,249,.78); --scrim:rgba(0,0,0,.32);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 6px 24px rgba(20,20,40,.05);
  --shadow-lg:0 24px 80px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r:20px; --r-sm:12px;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.30); --sep:rgba(84,84,88,.48);
  --accent:#3A8BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(58,139,255,.16);
  --green:#32D074; --green-soft:rgba(50,208,116,.15); --red:#FF6B66; --red-soft:rgba(255,107,102,.14);
  --orange:#FFA21F; --orange-soft:rgba(255,162,31,.15);
  --glass:rgba(18,18,20,.74); --scrim:rgba(0,0,0,.55);
  --shadow:0 0 0 .5px rgba(255,255,255,.04); --shadow-lg:0 24px 80px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.30); --sep:rgba(84,84,88,.48);
  --accent:#3A8BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(58,139,255,.16);
  --green:#32D074; --green-soft:rgba(50,208,116,.15); --red:#FF6B66; --red-soft:rgba(255,107,102,.14);
  --orange:#FFA21F; --orange-soft:rgba(255,162,31,.15);
  --glass:rgba(18,18,20,.74); --scrim:rgba(0,0,0,.55);
  --shadow:0 0 0 .5px rgba(255,255,255,.04); --shadow-lg:0 24px 80px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.press{transition:transform .18s var(--ease),opacity .18s}
.press:active{transform:scale(.97);opacity:.85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(104px + env(safe-area-inset-bottom,0px));max-width:1180px}
.side{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:.5px solid var(--sep);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10.5px;font-weight:500;color:var(--fg2);text-decoration:none;letter-spacing:.01em}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}
.tab-add{justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);margin-top:-14px}
.tab-add svg{width:26px;height:26px}

@media (min-width:900px){
  body::before{display:none}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:fixed;top:0;bottom:0;left:0;width:256px;z-index:20;
    padding:calc(28px + env(safe-area-inset-top,0px)) 16px 24px max(16px,env(safe-area-inset-left,0px));border-right:.5px solid var(--sep);background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
  .main{margin-left:256px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:max(44px,env(safe-area-inset-right,0px));padding-block:34px 56px}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:650;font-size:17px;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#15151C,#2E2E3B);display:grid;place-items:center;color:#fff}
.brand-mark svg{width:18px;height:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a svg{width:21px;height:21px;color:var(--fg2)}
.nav a:hover{background:var(--fill2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.side-add{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.side-add svg{width:18px;height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;font-size:12.5px;color:var(--fg2);padding:0 8px}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--fill);font-size:11px;font-weight:600;color:var(--fg2)}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.sync[data-s="cloud"] i{background:var(--green)}
.sync[data-s="slow"] i,.sync[data-s="error"] i{background:var(--orange)}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;margin-bottom:14px}
.ph-t{min-width:0}
.eyebrow{font-size:13px;color:var(--fg2);font-weight:500;margin:0 0 2px}
h1{font-size:34px;line-height:1.08;letter-spacing:-.025em;font-weight:750;margin:0;text-wrap:balance}
@media (min-width:900px){h1{font-size:32px}}
.ph-tools{display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:20px;height:20px}

.periodbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px)) 10px;background:linear-gradient(var(--bg) 70%,transparent)}
@media (min-width:900px){.periodbar{position:static;margin:0;padding:0;background:none;width:360px}}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;height:34px}
.seg-ind{position:absolute;top:2px;bottom:2px;left:2px;border-radius:8px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04);transition:transform .38s var(--ease)}
:root[data-theme="dark"] .seg-ind{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg-ind{background:#636366}}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:550;color:var(--fg);border-radius:8px}
.seg button[aria-pressed="true"]{font-weight:650}

/* ---------- cards & grid ---------- */
.grid{display:grid;gap:14px}
@media (min-width:900px){.grid.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}.span2{grid-column:1/-1}}
.col{display:grid;gap:14px;min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0}
.link{color:var(--accent);font-weight:550;font-size:14px;text-decoration:none;white-space:nowrap}
.muted{color:var(--fg2)}
.small{font-size:13px}

.hero{padding:22px 20px 20px}
.hero-l{font-size:14px;font-weight:550;color:var(--fg2);display:flex;align-items:center;gap:8px}
.big{font-family:var(--font-round);font-size:52px;line-height:1.02;font-weight:700;letter-spacing:-.035em;margin:8px 0 4px;white-space:nowrap}
.big small{font-size:.5em;letter-spacing:-.01em;color:var(--fg2);font-weight:650}
@media (max-width:380px){.big{font-size:44px}}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--orange-soft);color:var(--orange)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin:18px 0 12px;background:var(--fill2)}
.split span{display:block;height:100%;transition:flex-grow .5s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--fg2)}
.legend b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 13px;min-width:0}
.kpi-l{font-size:12.5px;color:var(--fg2);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font-family:var(--font-round);font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.kpi-v{font-size:18px}}

.swap{animation:swap .42s var(--ease)}
@keyframes swap{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* provision banner */
.save-card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.save-ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.save-ic svg{width:24px;height:24px}
.save-card .grow{flex:1;min-width:0}
.save-card strong{font-size:16px;font-weight:650}
.chev{width:18px;height:18px;color:var(--fg3);flex:none}

/* donut */
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:440px){.donut-wrap{grid-template-columns:1fr}.donut{margin:0 auto}}
.donut{position:relative;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{transition:stroke-dasharray .6s var(--ease),stroke-dashoffset .6s var(--ease)}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut-c b{display:block;font-family:var(--font-round);font-size:19px;font-weight:700;letter-spacing:-.02em}
.donut-c span{font-size:11.5px;color:var(--fg2)}
.cats{display:flex;flex-direction:column;gap:9px;min-width:0}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.catrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .pc{color:var(--fg2);font-size:12.5px;margin-left:6px}

/* lists (iOS inset grouped) */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;width:100%;text-align:left;position:relative}
button.row:hover{background:var(--fill2)}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--sep)}
.row .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-weight:600;white-space:nowrap}
.row .v small{display:block;font-size:12px;font-weight:500;color:var(--fg2)}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.tile svg{width:19px;height:19px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:20px 4px 7px;font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.group-h span:last-child{text-transform:none;letter-spacing:0;font-weight:600}
.date-chip{width:40px;flex:none;text-align:center;line-height:1.05;border-radius:10px;background:var(--fill2);padding:5px 0}
.date-chip b{display:block;font-size:16px;font-weight:700}
.date-chip span{font-size:10.5px;text-transform:uppercase;color:var(--fg2);font-weight:600;letter-spacing:.04em}

.totalbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 2px}
.totalbar .big{font-size:40px;margin:0}

/* échéancier */
.bars{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:210px;align-items:end;padding-top:20px}
.bar{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;cursor:pointer;border-radius:8px}
.bar i{display:block;width:100%;max-width:34px;border-radius:7px 7px 4px 4px;background:color-mix(in srgb,var(--accent) 30%,var(--fill));transition:height .5s var(--ease),background .2s}
.bar.peak i{background:color-mix(in srgb,var(--orange) 75%,transparent)}
.bar[aria-pressed="true"] i{background:var(--accent)}
.bar.peak[aria-pressed="true"] i{background:var(--orange)}
.bar span{font-size:11px;color:var(--fg2);font-weight:550;height:14px}
.avgline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--fg3);pointer-events:none}
.avgline em{position:absolute;right:0;top:-19px;font-style:normal;font-size:11px;font-weight:600;color:var(--fg2);background:var(--card);padding:0 4px;border-radius:4px}
.bars-wrap{position:relative;padding-bottom:20px}

/* provisions */
.pgrid{display:grid;gap:12px}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{display:flex;flex-direction:column;gap:12px}
.pcard-h{display:flex;gap:12px;align-items:center}
.pcard-h .grow{flex:1;min-width:0}
.pcard-h .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.prog span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .6s var(--ease)}
.prog.good span{background:var(--green)}
.prog-l{display:flex;justify-content:space-between;font-size:13px;color:var(--fg2)}
.prog-l b{color:var(--fg);font-weight:600}
.pacts{display:grid;grid-template-columns:1fr auto;gap:8px}
.btn{height:40px;border-radius:12px;padding:0 14px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%;height:50px;border-radius:14px;font-size:16px}
.btn svg{width:17px;height:17px}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--fg);font-size:13.5px;margin-bottom:14px}
.banner .btn{height:32px;font-size:13px;border-radius:9px}
.banner.warn{background:color-mix(in srgb,var(--orange) 16%,transparent)}
.banner>span{flex:1;min-width:0}
.banner>span>svg{width:17px;height:17px;display:inline-block;vertical-align:-3px;margin-right:6px;color:var(--orange)}
.banner .mini{margin:-4px -4px -4px 0}
.admin-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.admin-kpis .skel{height:92px}
.kpi-s{font-size:12px;line-height:1.3;color:var(--fg2);margin-top:3px}
.inp.area{height:auto;min-height:88px;padding:12px 14px;resize:vertical;box-shadow:none;background:var(--fill2);font:inherit;font-size:16px;line-height:1.4}
.row-pay{grid-template-columns:auto minmax(0,1fr) auto auto}
.pay{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.8px var(--fg3);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s,box-shadow .15s}
.pay svg{width:15px;height:15px}
.pay.on{background:var(--green);box-shadow:none;color:#fff}
.fc-chart{width:100%;height:130px;display:block;overflow:visible}
.fc-line{fill:none;stroke:var(--accent);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.fc-line.bad{stroke:var(--red)}
.fc-area{fill:color-mix(in srgb,var(--accent) 12%,transparent)}
.fc-area.bad{fill:color-mix(in srgb,var(--red) 10%,transparent)}
.fc-zero{stroke:var(--red);stroke-dasharray:4 4;stroke-width:1;vector-effect:non-scaling-stroke}
.fc-grid{stroke:var(--sep);stroke-width:1;vector-effect:non-scaling-stroke}
.fc-tick{font-size:9px;fill:var(--fg3)}
.fc-min{fill:var(--accent);stroke:var(--card);stroke-width:2;vector-effect:non-scaling-stroke}
.fc-min.bad{fill:var(--red)}.fc-min.warn{fill:var(--orange)}
.fc-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.fc-kpis div{display:flex;flex-direction:column;min-width:0}
.fc-kpis b{font-size:17px}
.bal-form{display:flex;gap:10px;align-items:center}
.bal-form .amount{flex:1;min-width:0}
.small-amt input{font-size:28px!important}
.fc-card{margin-bottom:14px}
.jet-card{position:relative}
.tip-x{position:absolute;top:8px;right:8px;width:28px;height:28px}
.tip-x svg{width:14px;height:14px}
.jet-card .grow{padding-right:22px}
.pro-aside{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--fill2)}
.pro-aside>div{display:flex;flex-direction:column;min-width:0}
.pot-rows{display:flex;flex-direction:column;gap:10px}
.pot-row{display:flex;align-items:center;gap:12px}
.pot-row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.pot-amt{font-weight:700;font-size:18px}
.jet{display:block;object-fit:contain;flex:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.jet-float{animation:jetFloat 3.2s ease-in-out infinite}
.jet-in{animation:jetIn .7s cubic-bezier(.2,1.4,.4,1) both, jetFloat 3.2s ease-in-out .7s infinite}
@keyframes jetFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.tcheck{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.8px var(--fg3);display:grid;place-items:center;color:transparent;transition:background .15s}

.empty{text-align:center;padding:40px 20px}

.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.4s infinite}

/* ---------- sheet ---------- */

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(100dvh - 12px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .46s var(--ease);box-shadow:var(--shadow-lg)}
.sheet.on{transform:none}
.sheet-h{flex:none;padding:8px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));touch-action:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fg3);margin:0 auto 8px}
.sheet-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.sheet-top h3{margin:0;font-size:17px;font-weight:650;text-align:center}

.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}

  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:540px;border-radius:24px;max-height:min(860px,calc(100dvh - 48px));transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .36s var(--ease),opacity .25s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
  .sheet-h{padding:16px 20px 6px}
  .sheet-b{padding:8px 20px 22px}
}
.sheet-b>*{flex-shrink:0}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 2px}
.amount input{font-family:var(--font-round);font-size:52px;font-weight:700;letter-spacing:-.035em;border:0;background:transparent;text-align:right;width:6.2ch;min-width:2ch;padding:0;outline:none;color:var(--fg)}

.conv .pill{background:var(--card);color:var(--fg2);box-shadow:var(--shadow);font-weight:550}
.conv .pill b{color:var(--fg);font-weight:650}
.field{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.field label,.flabel{display:block;font-size:12.5px;font-weight:600;color:var(--fg2);padding:0 4px 7px;text-transform:uppercase;letter-spacing:.04em}
.frow{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:50px;position:relative}
.frow+.frow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.frow>span{flex:none;min-width:116px}
.frow input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:14px 0;outline:none;text-align:right}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{height:34px;padding:0 13px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:550;display:inline-flex;align-items:center;gap:7px;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.chip .tile{width:22px;height:22px;border-radius:6px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:all .35s var(--ease);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

.share{font-size:12.5px;line-height:1.45;color:var(--fg2);background:var(--fill2);border-radius:12px;padding:10px 12px}

}

/* ---------- compte, foyer ---------- */

.stack{display:flex;flex-direction:column;gap:14px;max-width:640px}

@media (min-width:900px){.periodbar .fbar{justify-content:flex-end}}
.wtag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:650;background:var(--accent-soft);color:var(--accent);vertical-align:1px;margin-left:6px}

.range{display:flex;flex-direction:column;gap:8px;padding:14px 16px}

/* ---------- rappels ---------- */
.switch{position:relative;width:51px;height:31px;flex:none}

/* ---------- plusieurs prélèvements par mois ---------- */
.parts{padding:6px 0}

.parts-foot{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 8px;font-size:14px}
.approx{color:var(--fg2);font-weight:500;margin-right:2px}

/* ---------- catégories ---------- */
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.swatch{aspect-ratio:1;border-radius:50%;max-width:44px;width:100%;justify-self:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.icon-pick{height:44px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--fg2)}
.icon-pick svg{width:21px;height:21px}
.icon-pick[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.cat-preview{display:flex;align-items:center;gap:12px;justify-content:center;padding:8px 0 2px;font-weight:650;font-size:18px}
.cat-preview .tile{width:44px;height:44px;border-radius:13px}
.cat-preview .tile svg{width:24px;height:24px}
.catlist .row{grid-template-columns:auto minmax(0,1fr) auto}
.cat-acts{display:flex;gap:6px;align-items:center}
.mini{width:34px;height:34px;border-radius:10px;background:var(--fill2);display:grid;place-items:center;color:var(--fg2)}
.mini svg{width:17px;height:17px}
.mini:disabled{opacity:.3}
.chip.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep);color:var(--accent)}
.kwchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 4px}
.kwchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 11px;border-radius:999px;background:var(--fill2);font-size:14px}
.kwchip button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--fg2)}
.kwchip button svg{width:12px;height:12px}
.pend{display:flex;align-items:center;gap:6px;min-width:0}
.pend span{font-size:13px;color:var(--fg2);white-space:nowrap}
.prow .prow2{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:8px}
.prow .prow2 input.plabel{grid-column:auto}
.prow .ended{grid-column:1 / -1;font-size:12.5px;color:var(--fg2)}
</style>

  /* --- appli installée : Firebase (Auth + Firestore europe-west1, cache hors ligne) --- */

  stop(){ [...this.unsubs, ...this.hUnsubs].forEach(u => { try { u(); } catch {} }); this.unsubs = []; this.hUnsubs = []; this.closeChat(); state.support = null; state.supportList = []; },
  /* --- centre d'aide --- */
  watchSupport(u){

  /** Ouvre la conversation d'un compte (le sien, ou n'importe lequel pour l'administrateur). */
  openChat(uid){
    if(state.chat.uid === uid && this.chatUnsub) return;

    state.chat = { ...state.chat, uid, msgs:[], loaded:false };
    this.chatUnsub = S.onSnapshot(S.query(S.collection(F.db, 'support', uid, 'messages'), S.orderBy('at')), snap => {
      const n = state.chat.msgs.length;
      state.chat.msgs = snap.docs.map(d => ({ id:d.id, ...d.data({ serverTimestamps:'estimate' }) })); state.chat.loaded = true;
      this.markRead(); renderData(); if(state.chat.msgs.length > n) scrollChat();
    }, err => { console.warn('chat', err); state.chat.loaded = true; renderData(); });
  },
  closeChat(){ if(this.chatUnsub){ try { this.chatUnsub(); } catch {} } this.chatUnsub = null; if(state.chat) state.chat.uid = null; },
  /** Marque la conversation affichée comme lue (une seule écriture par nouveau message). */
  markRead(){
    const { uid } = state.chat || {}; if(!uid || !F) return;
    const { S } = F;
    if(state.route==='aide' && uid===state.user?.uid && supportUnreadUser()){ state.support.userReadAt = { toMillis: () => Date.now() };
      S.updateDoc(S.doc(F.db, 'support', uid), { userReadAt: S.serverTimestamp() }).catch(() => {}); }

      if(t && adminUnread(t)){ t.adminReadAt = { toMillis: () => Date.now() }; S.updateDoc(S.doc(F.db, 'support', uid), { adminReadAt: S.serverTimestamp() }).catch(() => {}); } }
  },
  async sendSupport(uid, text, topic){
    const { S } = F, asAdmin = uid !== state.user.uid, b = S.writeBatch(F.db), ref = S.doc(F.db, 'support', uid);
    const t = { lastAt: S.serverTimestamp(), lastFrom: asAdmin ? 'admin' : 'user', lastText: text.slice(0, 140) };
    if(asAdmin) t.adminReadAt = S.serverTimestamp();
    else { Object.assign(t, { email: state.user.email.slice(0, 254), name: (profileOf(state.user.uid).name || '').slice(0, 40), topic, status:'open', userReadAt: S.serverTimestamp() });
      if(!state.support) t.createdAt = S.serverTimestamp(); }
    const m = { from: t.lastFrom, text, at: S.serverTimestamp() };
    if(!asAdmin && topic==='bug') m.meta = { ua: navigator.userAgent.slice(0, 300), build: BUILD, app: isStandalone() };

  setSupportStatus(uid, status){ const { S } = F; return this.write(S.updateDoc(S.doc(F.db, 'support', uid), { status })); },
  onUser(u){
    this.stop(); state.hid = null; state.lines = []; state.invite = null; state.meta = { name:'Bud Jet' }; this.autoDone = false; catDocs = {}; rebuildCats();
    if(!u){ clearTimeout(this.slowT); state.user = null; state.mode = 'auth'; render(); return; }
    state.user = { uid:u.uid, email:u.email || '', verified: !!u.emailVerified }; state.mode = 'loading'; render();
    const { S } = F;
    // Réglages de l'appli publiés depuis la console d'administration (message, inscriptions, version).
    this.unsubs.push(S.onSnapshot(S.doc(F.db, 'config', 'app'), snap => { state.config = snap.exists() ? snap.data() : {}; renderData(); }, () => {}));
    this.watchSupport(u);
    this.unsubs.push(S.onSnapshot(S.doc(F.db, 'users', u.uid), { includeMetadataChanges:true }, snap => {
      // Attendre la confirmation du serveur : un foyer tout juste créé ou rejoint n'est lisible qu'après.
      if(snap.metadata.hasPendingWrites) return;
      const h = snap.exists() ? snap.data().householdId : null;
      state.notify = { ...NOTIFY_DEFAULT, ...((snap.exists() && snap.data().notify) || {}) };
      if(!h){ if(!snap.metadata.fromCache){ clearTimeout(this.slowT); state.slow = false; state.mode = 'onboard'; render(); } return; }
      if(h !== state.hid) this.watchHousehold(h);
      // Dernier passage (une fois par jour) : sert uniquement au comptage des comptes actifs.
      const day = iso(today0());
      if(!snap.metadata.fromCache && snap.data().seen !== day && this.seenDay !== day){ this.seenDay = day; S.updateDoc(S.doc(F.db, 'users', u.uid), { seen: day }).catch(() => {}); }
    }, err => this.fbError(err)));
  },
  watchHousehold(h, attempt = 0){
    this.hUnsubs.forEach(u => u()); this.hUnsubs = [];
    state.hid = h; const { S } = F;
    const onErr = err => {
      // Juste après la création ou l'adhésion, l'accès peut mettre un instant à être reconnu : on réessaie.
      if(err && err.code === 'permission-denied' && attempt < 3 && state.hid === h){ setTimeout(() => { if(state.hid === h) this.watchHousehold(h, attempt + 1); }, 800 * (attempt + 1)); return; }
      this.fbError(err);
    };
    this.hUnsubs.push(S.onSnapshot(S.doc(F.db, 'households', h), snap => {
      if(!snap.exists()) return;
      const d = snap.data();
      state.meta = { name:d.name, owner:d.owner, members:d.members || [], memberEmails:d.memberEmails || {}, memberProfiles:d.memberProfiles || {}, split:d.split || null, balances:d.balances || {} };
      this.autoProfile();
      renderData();
    }, onErr));
    this.hUnsubs.push(S.onSnapshot(S.collection(F.db, 'households', h, 'categories'), snap => {
      catDocs = {}; snap.docs.forEach(d => { catDocs[d.id] = d.data(); }); rebuildCats(); renderData();
    }, () => {}));
    this.hUnsubs.push(S.onSnapshot(S.collection(F.db, 'households', h, 'payments'), snap => {
      state.payments = {}; snap.docs.forEach(d => { state.payments[d.id] = { id:d.id, ...d.data() }; }); renderData();
    }, () => {}));
    this.hUnsubs.push(S.onSnapshot(S.collection(F.db, 'households', h, 'goals'), snap => {
      state.goals = snap.docs.map(d => ({ id:d.id, ...d.data() })); renderData();
    }, () => {}));
    this.hUnsubs.push(S.onSnapshot(S.collection(F.db, 'households', h, 'lines'), { includeMetadataChanges:true }, snap => {
      state.lines = snap.docs.map(d => ({ id:d.id, ...d.data() }));

  /** Première fois avec Google : reprendre le prénom et la photo du compte Google. */
  autoProfile(){

    const g = (F.auth.currentUser?.providerData || []).find(p => p.providerId === 'google.com');

    if(!name && !photo) return;
    const prof = {}; if(name) prof.name = name.slice(0,40); if(photo && photo.startsWith('https://')) prof.photo = photo;

  saveProfile(prof){
    const me = state.user.uid; const clean = {};

  lineRef(id, h = state.hid){ return F.S.doc(F.db, 'households', h, 'lines', id); },

  /* --- local (secours) --- */
  startLocal(){
    const saved = ls.get('bf.lines', null);

  /* --- opérations communes --- */
  async save(line){
    if(F && state.hid) return this.write(F.S.setDoc(this.lineRef(line.id), this.clean(line)));
    const body = this.clean(line);
    if(DB){ try { await DB.collection('lines').doc(line.id).set(body); return true; } catch(e){ return this.fail(e); } }
    const i = state.lines.findIndex(l=>l.id===line.id);
    if(i>=0) state.lines[i] = {...line, ...body}; else state.lines.push({...line, ...body});
    this.persistLocal(); render(); return true;
  },
  async remove(id){
    if(F && state.hid) return this.write(F.S.deleteDoc(this.lineRef(id)));
    if(DB){ try { await DB.collection('lines').doc(id).delete(); return true; } catch(e){ return this.fail(e); } }
    state.lines = state.lines.filter(l=>l.id!==id); this.persistLocal(); render(); return true;
  },
  async bulkSave(lines, h = state.hid){
    if(F && h){ for(let i=0; i<lines.length; i+=400){ const b = F.S.writeBatch(F.db); lines.slice(i,i+400).forEach(l => b.set(this.lineRef(l.id, h), this.clean(l))); this.write(b.commit()); } return true; }
    if(DB){ for(const l of lines) await this.save(l); return true; }
    const ids = new Set(lines.map(l=>l.id)); state.lines = [...state.lines.filter(x=>!ids.has(x.id)), ...lines.map(l=>({...l, updatedAt:Date.now()}))];
    this.persistLocal(); render(); return true;
  },
  async bulkRemove(ids){
    if(F && state.hid){ for(let i=0; i<ids.length; i+=400){ const b = F.S.writeBatch(F.db); ids.slice(i,i+400).forEach(id => b.delete(this.lineRef(id))); this.write(b.commit()); } return true; }
    if(DB){ for(const id of ids) await this.remove(id); return true; }
    const set = new Set(ids); state.lines = state.lines.filter(l=>!set.has(l.id)); this.persistLocal(); render(); return true;
  },
  /** Enregistre les réglages d'une catégorie (fournie ou créée), partagés par tout le foyer. */

  /** Comptages pour la console : comptes, foyers, activité, appareils. Jamais le contenu des budgets. */
  async adminStats(){

  async pushStatus(){

  async enablePush(){

    let sub = await reg.pushManager.getSubscription();

  },

/* ================= derived ================= */
function totals(p = state.period, sc = scopeNow()){
  const L = state.lines.filter(l => inScope(l, sc));
  const inc = L.filter(l=>l.kind==='income'); const exp = L.filter(l=>l.kind==='expense');
  const income = sum(inc, l=>perPeriod(l,p,sc));
  const savings = sum(exp.filter(l=>l.cat==='epargne'), l=>perPeriod(l,p,sc));
  const spend = sum(exp.filter(l=>l.cat!=='epargne'), l=>perPeriod(l,p,sc));
  const provisions = sum(exp.filter(isProvision), l=>perPeriod(l,p,sc));
  const free = income - spend - savings;
  return {income, spend, savings, provisions, free, rate: income ? savings/income : 0};
}
function byCat(kind, p = state.period){
  const m = new Map();
  state.lines.filter(l=>l.kind===kind && inScope(l)).forEach(l => { const k = CATS[l.cat] ? l.cat : (kind==='income'?'autres':'divers'); m.set(k, (m.get(k)||0) + perPeriod(l,p)); });
  return [...m.entries()].map(([id,v])=>({id,v,c:CATS[id]})).sort((a,b)=>b.v-a.v);
}
function upcoming(n=6){
  const t = today0(), lim = addMonths(t, 2), out = [];
  state.lines.filter(l => inScope(l) && l.freq!=='weekly').forEach(l => {
    if(l.freq==='multi') multiOccurrences(l, t, lim).forEach(o => out.push({ l, d:o.date, amt:o.amt, part:o.part }));
    else { const d = nextDue(l, t); if(d) out.push({ l, d, amt:+l.amount || 0 }); }
  });
  return out.sort((a,b) => a.d - b.d || b.amt - a.amt).slice(0, n);
}
function timeline(){
  const t = today0(); const start = new Date(t.getFullYear(), t.getMonth(), 1);
  const months = Array.from({length:12}, (_,i) => ({ start: addMonths(start,i), end: addMonths(start,i+1), out:0, inc:0, items:[], incItems:[] }));
  state.lines.filter(l => inScope(l)).forEach(l => {
    const f = shareOf(l);
    months.forEach(m => {
      const occ = occurrences(l, m.start, m.end);
      const add = (amt, date, part) => { const it = {l, amt, date, part}; if(l.kind==='expense'){ m.out += amt; m.items.push(it); } else { m.inc += amt; m.incItems.push(it); } };
      if(l.freq==='multi'){ multiOccurrences(l, m.start, m.end).forEach(o => add(o.amt * f, o.date, o.part)); return; }
      const e = endDate(l);
      if(occ===null){ if(!e || m.start <= e) add(yearly(l)/12, null); }
      else occ.forEach(d => add((+l.amount||0) * f, d));
    });
  });
  return months;
}

function endingSoon(){
  const t = today0(), lim = addMonths(t, 12), P_ = PERIODS[state.period];
  const items = [];
  state.lines.filter(l => inScope(l)).forEach(l => {
    if(endDate(l) && endDate(l) <= lim) items.push({ l, e:endDate(l), per: perPeriod(l), r: remaining(l) });
    else if(l.freq==='multi') activeParts(l).filter(p => validDate(p.end) && parseDate(p.end) <= lim).forEach(p => {
      const occ = multiOccurrences({ ...l, parts:[p] }, t, new Date(parseDate(p.end).getTime() + 86400000));
      items.push({ l, part:p, e:parseDate(p.end), per: (+p.amount) * 12 * shareOf(l) / PERIODS[state.period].div, r:{ count:occ.length, total:sum(occ, o => o.amt) } });
    });
  });
  if(!items.length) return '';
  items.sort((a,b) => a.e - b.e);
  const freed = sum(items.filter(x => x.l.kind==='expense'), x => x.per);
  return `<section><div class="card-h" style="padding:0 4px;margin:4px 0 8px"><h2>Bientôt terminés</h2>${freed ? `<span class="muted small">+${eur(freed)} ${P_.unit} libérés</span>` : ''}</div>
    <div class="list">${items.map(({l, part, e, per, r}) => `<button class="row press" data-edit="${esc(l.id)}">${tile(l.cat)}
        <span style="min-width:0"><div class="t">${esc(l.label)}${partName(part)}</div><div class="s">Dernier paiement en ${monthYear(e)}${r && r.count ? ` · reste ${eur(r.total * shareOf(l), 0)}` : ''}</div></span>
        <span class="v num" style="color:${l.kind==='expense'?'var(--green)':'var(--orange)'}">${l.kind==='expense'?'+':'−'}${eur(per)}<small>${P_.unit}</small></span></button>`).join('')}</div></section>`;
}
function miniTimeline(){

/** Photo choisie : recadrée en carré, réduite à 192 px, JPEG (~15 Ko) pour tenir dans le foyer. */
async function resizePhoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const S = 192, c = document.createElement('canvas'); c.width = c.height = S;
    const side = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - side)/2, sy = (img.naturalHeight - side)/2;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, sx, sy, side, side, 0, 0, S, S);
    let q = .85, out = c.toDataURL('image/jpeg', q);
    while(out.length > 70000 && q > .4){ q -= .15; out = c.toDataURL('image/jpeg', q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

/* ================= solde prévisionnel ================= */
const BAL_DAYS = 92;
/** Jour du virement vers le compte commun : le lendemain du premier salaire attribué, sinon le 1er. */
const transferDay = () => { const ds = state.lines.filter(l => l.kind === 'income' && whoOf(l) && !proPart(l) && validDate(l.due)).map(l => parseDate(l.due).getDate()); return ds.length ? Math.min(28, Math.min(...ds) + 1) : 1; };
const balKey = () => whoNow();
const balWhere = () => { const w = whoNow(); return w === 'all' ? 'ton compte' : w === 'common' ? 'le compte commun' : `le compte de ${esc(firstName(w))}`; };
function forecast(){
  const b = (state.meta.balances || {})[balKey()]; if(!b || !validDate(b.date) || !isFinite(+b.amount)) return null;
  const t = today0(), start = parseDate(b.date) > t ? t : parseDate(b.date), end = new Date(t.getFullYear(), t.getMonth(), t.getDate() + BAL_DAYS);
  const n = daysBetween(start, end), delta = new Array(n + 1).fill(0), stop = new Date(end.getTime() + 86400000);
  state.lines.forEach(l => {
    const f = shareOf(l); if(!f) return; const sg = l.kind === 'income' ? 1 : -1;
    const add = (d, amt, pi) => { const i = daysBetween(start, d); if(i < 0 || i > n) return; if(i === 0 && paidOf(l, d, pi)) return; delta[i] += sg * amt * f; };
    if(l.freq === 'multi'){ multiOccurrences(l, start, stop).forEach(o => add(o.date, o.amt, partIdx(l, o.part))); return; }
    const occ = occurrences(l, start, stop);
    if(occ === null){ if(!isActive(l)) return; const per = yearlyRaw(l) / 365 * f * sg; for(let i = 1; i <= n; i++) delta[i] += per; return; }
    occ.forEach(d => add(d, +l.amount || 0, -1));
  });
  // Virements vers le compte commun (pot commun) : rentrée pour le compte commun, sortie pour le compte de chacun.
  const pc = potCommun(), w = whoNow(); let transfer = null;
  if(pc && pc.need > 0 && (w === 'common' || people().includes(w))){
    const amt = w === 'common' ? pc.need : ((pc.rows.find(r => r.uid === w) || {}).amount || 0), sg = w === 'common' ? 1 : -1, day = transferDay();
    transfer = { amt, day };
    let y = start.getFullYear(), m = start.getMonth();
    for(let k = 0; k < 6; k++){ const d = dayIn(y, m, day), i = daysBetween(start, d); if(i >= 1 && i <= n) delta[i] += sg * amt; if(++m > 11){ m = 0; y++; } }
  }
  const series = []; let v = +b.amount; for(let i = 0; i <= n; i++){ v += delta[i]; series.push(v); }
  const ti = daysBetween(start, t); let mi = ti; for(let i = ti; i <= n; i++) if(series[i] < series[mi]) mi = i;
  const dayOf = i => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
  return { transfer, b, start, series, ti, mi, min: series[mi], minDate: dayOf(mi), now: series[ti], end: series[n], dayOf, n, age: daysBetween(parseDate(b.date), t) };
}
function forecastCard(){

  const form = (label, val) => `<div class="bal-form"><div class="amount small-amt"><input id="bal-in" inputmode="decimal" placeholder="0" value="${val}" aria-label="Solde actuel"><span>€</span></div><button class="btn primary press" data-act="bal-save">${label}</button></div>`;
  if(!fc || state.balEdit === key) return `<section class="card fc-card"><div class="card-h"><h2>Solde prévisionnel</h2>${fc ? '<button class="link" data-act="bal-cancel">Annuler</button>' : ''}</div>

    ${form(fc ? 'Mettre à jour' : 'Voir la prévision', fc ? String(Math.round(fc.now)) : '')}</section>`;

      ${ticks.join('')}${lo < 0 ? `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" class="fc-zero"/>` : ''}

/* ================= pot commun ================= */
const SPLIT_MODES = { equal:'À parts égales', income:'Selon les revenus', custom:'Personnalisé' };
/** Montant mensuel d'une ligne, part privée seulement (le pro ne passe pas par le compte commun). */
const privMonthly = l => isActive(l) ? yearlyRaw(l) * (1 - proPart(l)) / 12 : 0;
function potCommun(){
  const P = people(); if(P.length < 2) return null;
  const sp = state.meta.split || { mode:'equal' }, mode = SPLIT_MODES[sp.mode] ? sp.mode : 'equal';
  const common = state.lines.filter(l => !whoOf(l));
  const out = sum(common.filter(l => l.kind === 'expense'), privMonthly), inn = sum(common.filter(l => l.kind === 'income'), privMonthly);
  const need = Math.max(0, out - inn);
  const inc = Object.fromEntries(P.map(u => [u, sum(state.lines.filter(l => whoOf(l) === u && l.kind === 'income'), privMonthly)]));
  const persOut = Object.fromEntries(P.map(u => [u, sum(state.lines.filter(l => whoOf(l) === u && l.kind === 'expense'), privMonthly)]));
  const totInc = sum(P, u => inc[u]);
  let w;
  if(mode === 'income' && totInc > 0) w = Object.fromEntries(P.map(u => [u, inc[u] / totInc]));
  else if(mode === 'custom'){ const sh = sp.shares || {}, t = sum(P, u => +sh[u] || 0); w = Object.fromEntries(P.map(u => [u, t ? (+sh[u] || 0) / t : 1 / P.length])); }
  else w = Object.fromEntries(P.map(u => [u, 1 / P.length]));
  const rows = P.map(u => ({ uid:u, pct:w[u], amount: need * w[u], income: inc[u], left: inc[u] - persOut[u] - need * w[u] }));
  return { mode, need, out, inn, rows, noIncome: mode === 'income' && totInc <= 0 };
}
function potCard(){
  const pc = potCommun(); if(!pc || !(pc.out > 0)) return '';
  return `<section class="card pot-card"><div class="card-h"><h2>Pot commun</h2><button class="link" data-act="split-open">${SPLIT_MODES[pc.mode]} ›</button></div>
    <div class="muted small" style="margin:-4px 0 10px">Chaque mois, pour couvrir ${eur(pc.need)} de dépenses communes${pc.inn ? ` (après ${eur(pc.inn)} de rentrées communes)` : ''}&nbsp;:</div>
    <div class="pot-rows">${pc.rows.map(r => `<div class="pot-row">${avatar(r.uid, 'sm')}<span class="grow"><b>${esc(firstName(r.uid))}</b><span class="muted small">${Math.round(r.pct*100)} %${r.income ? ` · reste perso ${eur(r.left, 0)}` : ''}</span></span><span class="num pot-amt">${eur(r.amount)}</span></div>`).join('')}</div>
    ${pc.noIncome ? `<p class="muted small" style="margin:10px 0 0">Pour répartir selon les revenus, attribue les salaires à chacun (« Pour qui » dans la ligne). En attendant, partage à parts égales.</p>`
      : `<p class="muted small" style="margin:10px 0 0">Astuce de Jet : programme un virement permanent de ce montant vers le compte commun, le lendemain du salaire.</p>`}
  </section>`;
}

/** Image de l'assistant. pose : arrive | bravo | reflechit | alerte | fete ; anim : 'in' (entrée), 'float' (flotte) */
const jet = (pose, size = 72, anim = 'float') => `<img class="jet jet-${anim}" src="assets/jet/${pose}.webp" width="${size}" height="${size}" alt="Bud Jet" decoding="async" draggable="false">`;
/** Conseil du jour sur l'accueil, selon la situation du budget. */
/* ---------- Jet, conseiller belge ---------- */
const lineHas = (l, kws) => { const n = norm(l.label); return kws.some(k => n.includes(k)); };
const extLink = (href, label) => `<a class="link" href="${href}" target="_blank" rel="noopener">${label} ↗</a>`;
/** Estimation de ce qu'un indépendant complémentaire devrait mettre de côté chaque mois (indicatif). */
function proSetAside(){
  const pro = state.lines.filter(l => isActive(l) && proPart(l) > 0), P = l => yearlyRaw(l) * proPart(l);
  const R = sum(pro.filter(l => l.kind === 'income'), P) - sum(pro.filter(l => l.kind === 'expense'), P);
  if(!(R > 0)) return null;
  const hasCotis = pro.some(l => l.kind === 'expense' && lineHas(l, ['cotisation', 'caisse sociale', 'xerius', 'partena', 'liantis', 'acerta', 'ucm', 'securex']));
  const cot = hasCotis ? 0 : R * 0.205, tax = (R - cot) * 0.40;
  return { R, cot, tax, monthly: (cot + tax) / 12, hasCotis };
}
/** Conseils de saison et d'échéance de contrat, à partir du budget. */
function jetAdvice(){
  const t = today0(), y = t.getFullYear(), mo = t.getMonth(), half = `${y}-${mo < 6 ? 1 : 2}`, out = [], act = state.lines.filter(l => isActive(l) && whoMatch(l));
  // Déclaration fiscale : de mai à mi-juillet
  if(mo >= 4 && (mo < 6 || (mo === 6 && t.getDate() <= 15))){
    const found = [];
    if(act.some(l => lineHas(l, ['epargne-pension', 'epargne pension']))) found.push('ton épargne-pension');
    if(act.some(l => lineHas(l, ['titre-service', 'titres-services', 'titres services', 'titre service']))) found.push('tes titres-services');
    if(act.some(l => lineHas(l, ['creche', 'garderie', 'accueillante', "garde d'enfant", 'garde enfant']))) found.push("tes frais de garde d'enfants");
    if(act.some(l => lineHas(l, ['don ', 'dons', 'unicef', 'croix-rouge', 'croix rouge']))) found.push('tes dons (à partir de 40 €)');
    out.push({ id:`impots-${y}`, pose:'reflechit', title:'Saison de la déclaration fiscale',
      text: found.length ? `Sur Tax-on-web, vérifie que ces réductions d'impôt sont bien reprises : ${found.join(', ')}.` : "Sur Tax-on-web, pense aux réductions d'impôt : épargne-pension, titres-services, frais de garde d'enfants, dons.",
      link: extLink('https://eservices.minfin.fgov.be/myminfin-web/', 'MyMinfin') });
  }
  // Assurances annuelles : résiliation au moins 3 mois avant l'échéance
  act.filter(l => l.kind === 'expense' && l.cat === 'assurances' && l.freq === 'annual').forEach(l => {
    const d = nextDue(l); if(!d) return; const n = daysBetween(t, d); if(n < 95 || n > 125) return;
    const lim = addMonths(d, -3);
    out.push({ id:`preavis-${l.id}-${iso(d)}`, pose:'alerte', title:`${esc(l.label)} : c'est le moment de comparer`,
      text:`Elle se renouvelle le ${dueText(d).replace(/\.$/, '')}. Pour en changer, il faut résilier au moins 3 mois avant, donc au plus tard le ${dueText(lim).replace(/\.$/, '')}.`, link:'' });
  });
  // Énergie : comparer deux fois par an (changer de fournisseur est gratuit)
  if(act.some(l => l.kind === 'expense' && (l.cat === 'energie' && lineHas(l, ['electri', 'gaz', 'energie', 'engie', 'luminus', 'totalenergies', 'mega']))))
    out.push({ id:`energie-${half}`, pose:'reflechit', title:"Ton contrat d'énergie est-il le bon ?", text:"Changer de fournisseur d'électricité ou de gaz est gratuit et sans préavis long. Compare sur le simulateur officiel de la CREG.", link: extLink('https://www.creg.be', 'creg.be') });
  // Télécom : changement sans frais après 6 mois de contrat
  const tel = act.filter(l => l.kind === 'expense' && l.cat === 'abonnements' && lineHas(l, ['internet', 'gsm', 'proximus', 'telenet', 'orange', 'voo', 'scarlet', 'mobile', 'base']));
  if(sum(tel, l => yearlyRaw(l) / 12) >= 50)
    out.push({ id:`telecom-${half}`, pose:'reflechit', title:'Internet et GSM : un pack moins cher ?', text:"Après 6 mois de contrat, tu peux changer d'opérateur sans frais. Le comparateur officiel du régulateur (IBPT) t'aide à trouver l'offre la moins chère.", link: extLink('https://www.meilleurtarif.be', 'meilleurtarif.be') });
  // Indépendant complémentaire
  const ps = proSetAside();
  if(ps) out.push({ id:`pro-${y}-${Math.floor(mo / 3)}`, pose:'reflechit', title:'Activité complémentaire : mets de côté',
    text:`Estimation : environ ${eur(ps.monthly, 0)} par mois pour ${ps.hasCotis ? "l'impôt" : "tes cotisations sociales et l'impôt"} sur un résultat de ${eur(ps.R, 0)} par an.`, link:'<a class="link" href="#provisions">Provisions</a>' });
  const off = ls.get('bf.tipsOff', {}) || {};
  return out.filter(a => !off[a.id]);
}
function jetTip(T, up){
  if(!state.lines.length) return '';
  const P_ = PERIODS[state.period], soon = up.find(u => u.l.kind === 'expense' && daysBetween(today0(), u.d) <= 7);
  const late = state.lines.filter(l => isProvision(l) && isActive(l) && whoMatch(l) && provisionState(l).status === 'late').length;
  let pose, title, text, link = '', adv, tipId = '';
  const fc = forecast();
  if(fc && fc.min < 0){ pose = 'alerte'; title = `Découvert en vue le ${dueText(fc.minDate)}`; text = `${balWhere()[0].toUpperCase() + balWhere().slice(1)} passerait à ${eur(fc.min, 0)}. Prévois ${eur(-fc.min + 100, 0)} de marge.`; link = '<a class="link" href="#echeancier">Voir la prévision</a>'; }
  else if(T.free < 0 && scopeNow() !== 'pro' && whoNow() !== 'common'){ pose = 'alerte'; title = 'On dépasse un peu…'; text = `Tes sorties dépassent tes rentrées de ${eur(-T.free)} ${P_.noun}. Regardons ensemble où ajuster.`; link = '<a class="link" href="#budget">Voir le budget</a>'; }
  else if((adv = jetAdvice()[0])){ pose = adv.pose; title = adv.title; text = adv.text; link = adv.link; tipId = adv.id; }
  else if(soon){ pose = 'alerte'; title = `${esc(soon.l.label)} ${relDays(soon.d)}`; text = `${approx(soon.l)}${eur(soon.amt * shareOf(soon.l))} à prévoir sur le compte.`; link = '<a class="link" href="#echeancier">Échéancier</a>'; }
  else if(late){ pose = 'reflechit'; title = 'Petit rattrapage'; text = `${late} dépense${late>1?'s':''} irrégulière${late>1?'s':''} à mettre de côté pour être prêt à l'échéance.`; link = '<a class="link" href="#provisions">Provisions</a>'; }
  else { pose = 'bravo'; title = 'Budget sous contrôle'; text = T.free > 0 ? `Il te reste ${eur(T.free)} ${P_.noun} après tout. Bien joué !` : 'Tout est prévu, aucune mauvaise surprise en vue.'; }
  return `<section class="card jet-card">${jet(pose, 68)}${tipId ? `<button class="mini press tip-x" data-act="tip-off" data-tip="${tipId}" aria-label="Masquer ce conseil">${ic('close')}</button>` : ''}<div class="grow"><div class="jet-t">${title}</div><div class="muted small">${text}</div>${link ? `<div style="margin-top:6px">${link}</div>` : ''}</div></section>`;
}

    return k.includes(' ') || k.length >= 5 ? n.includes(k) : n.split(/[^a-z0-9-]+/).some(t => t === k.trim() || (k.length >= 4 && t.startsWith(k))); }));

function tplDue(it){
  if(!it.due || it.freq === 'weekly') return '';
  const t = today0(), [m, d] = it.due;
  const base = m ? new Date(t.getFullYear(), m - 1, d) : new Date(t.getFullYear(), t.getMonth(), d);
  const step = m ? (FREQ[it.freq].months || 12) : 1;
  let x = base, i = 0; while(x < t && i < 60) x = addMonths(base, step * ++i);   // depuis la date de base : pas de dérive en fin de mois
  return iso(x);
}

async function saveSheet(){
  const s = sheet; if(!s) return;
  const amount = parseAmount(s.amountStr);
  if(!isFinite(amount) || amount<=0){ toast('Indique un montant'); $('#f-amount').focus(); return; }
  if(!(s.label||'').trim()){ toast('Donne un nom à cette ligne'); $('#f-label').focus(); return; }
  if((s.due && s.freq!=='multi' && !validDate(s.due)) || (s.end && s.freq!=='once' && s.freq!=='multi' && !validDate(s.end))){ toast('Date incomplète : vérifie l\'année'); return; }
  if(s.end && s.due && s.end < s.due && s.freq!=='once' && s.freq!=='multi'){ toast('La fin des paiements doit être après la prochaine échéance'); return; }
  let parts = null;
  if(s.freq==='multi'){
    const badEnd = s.parts.findIndex(p => p.end && !validDate(p.end));
    if(badEnd >= 0){ toast(`Prélèvement ${badEnd+1} : date de fin incomplète`); return; }
    const bad = s.parts.findIndex(p => !(+p.day >= 1) || !(parseAmount(p.amount) > 0));
    if(!s.parts.length || bad >= 0){ toast(bad >= 0 ? `Prélèvement ${bad+1} : choisis le jour et le montant` : 'Ajoute au moins un prélèvement'); return; }
    parts = s.parts.map(p => { const o = { day:+p.day, amount: Math.round(parseAmount(p.amount)*100)/100 }; if(p.label.trim()) o.label = p.label.trim().slice(0,30); if(p.end) o.end = p.end; return o; });
  }
  const line = { id:s.id, kind:s.kind, label:s.label.trim(), amount: Math.round(amount*100)/100, freq:s.freq,
    cat: s.cat || (s.kind==='income'?'autres':'divers'), due: s.freq==='multi' ? '' : (s.due||''), end: (s.freq==='once' || s.freq==='multi') ? '' : (s.end||''), saved: isProvision({kind:s.kind,freq:s.freq}) ? Math.max(0, +s.saved||0) : 0,
    pro: s.nature==='private' ? 0 : s.nature==='pro' ? 100 : Math.min(95, Math.max(5, Math.round(+s.pro||50))),
    variable: !!s.variable,
    who: hasPeople() && people().includes(s.who) ? s.who : '',
    createdAt: s.createdAt || Date.now() };
  if(parts) line.parts = parts;
  if(s.example) line.example = true;
  const isNew = s.isNew; closeSheet();
  if(await Store.save(line)) toast(isNew ? 'Ligne ajoutée' : 'Modifications enregistrées');
}

  const f = state.form; state.formErr = ''; state.formInfo = '';
  const run = async fn => { state.busy = true; render(); try { await fn(); } catch(err){ console.warn(err); state.formErr = errMsg(err); } state.busy = false; render(); };
  if(form.id==='auth-form'){
    const em = ($('#a-email').value||'').trim(), pw = $('#a-pw').value||''; f['a-email'] = em; f['a-pw'] = pw;
    if(!em || !pw){ state.formErr = 'Saisis ton e-mail et ton mot de passe.'; return render(); }
    await run(async () => { if((state.authTab||'in')==='up') await Store.signUp(em, pw); else await Store.signIn(em, pw); f['a-pw'] = ''; });
  }
  if(form.id==='create-form'){
    const name = ($('#o-name').value||'').trim() || 'Notre foyer';
    const imp = $('#o-import') ? $('#o-import').checked : false;
    await run(async () => { await Store.createHousehold(name.slice(0,40), imp ? localImportable() : []); state.form = {}; toast(`Foyer « ${name} » créé`); });
  }
  if(form.id==='join-form'){
    const code = ($('#o-code').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(code.length !== 8){ state.formErr = errMsg({code:'join/format'}); return render(); }
    await run(async () => { await Store.joinHousehold(code); state.form = {}; toast('Bienvenue dans le foyer'); });
  }
  if(form.id==='profile-form'){
    const name = ($('#h-pname').value||'').trim(); delete f['h-pname']; $('#h-pname').blur();
    Store.saveProfile({ ...profileOf(state.user.uid), name }); toast('Profil enregistré'); return;
  }
  if(form.id==='name-form'){
    const name = ($('#h-name').value||'').trim(); if(!name) return;
    delete f['h-name']; $('#h-name').blur(); await Store.saveMeta({ name: name.slice(0,40) }); toast('Nom enregistré');
  }
});
document.addEventListener('keydown', e => {
  if(catSheet){ if(e.key==='Escape') leaveCatSheet(); return; }
  if(sheet){ if(e.key==='Escape') closeSheet(); return; }
  if(e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey || document.body.classList.contains('gate')) return;
  const k = e.key.toUpperCase();
  if(k==='N'){ e.preventDefault(); openSheet(); return; }
  const p = PKEYS.find(x=>PERIODS[x].key===k); if(p) setPeriod(p);
});
let mqDesk = window.matchMedia('(min-width:900px)'); mqDesk.addEventListener?.('change', ()=>render());
window.addEventListener('hashchange', route);

/* PWA: offline + installable when served from its own host */
if('serviceWorker' in navigator && location.protocol==='https:' && !IN_CLAUDE){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

route();
Store.init();
</script>
