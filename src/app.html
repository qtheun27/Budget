<title>Budget du Foyer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone = large-title pages + glass tab bar + bottom sheet; desktop (>=900px) = glass sidebar + two-column grid + centered sheet. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F6F6F9; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --fg:#0B0B0F; --fg2:rgba(60,60,67,.64); --fg3:rgba(60,60,67,.34); --sep:rgba(60,60,67,.13);
  --accent:#0A66FF; --accent-ink:#FFFFFF; --accent-soft:rgba(10,102,255,.10);
  --green:#17A158; --green-soft:rgba(23,161,88,.12); --red:#E0403F; --red-soft:rgba(224,64,63,.10);
  --orange:#E07B00; --orange-soft:rgba(224,123,0,.12);
  --glass:rgba(246,246,249,.78); --scrim:rgba(0,0,0,.32);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 6px 24px rgba(20,20,40,.05);
  --shadow-lg:0 24px 80px rgba(0,0,0,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r:20px; --r-sm:12px;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.30); --sep:rgba(84,84,88,.48);
  --accent:#3A8BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(58,139,255,.16);
  --green:#32D074; --green-soft:rgba(50,208,116,.15); --red:#FF6B66; --red-soft:rgba(255,107,102,.14);
  --orange:#FFA21F; --orange-soft:rgba(255,162,31,.15);
  --glass:rgba(18,18,20,.74); --scrim:rgba(0,0,0,.55);
  --shadow:0 0 0 .5px rgba(255,255,255,.04); --shadow-lg:0 24px 80px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#232326; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --fg:#F5F5F7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.30); --sep:rgba(84,84,88,.48);
  --accent:#3A8BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(58,139,255,.16);
  --green:#32D074; --green-soft:rgba(50,208,116,.15); --red:#FF6B66; --red-soft:rgba(255,107,102,.14);
  --orange:#FFA21F; --orange-soft:rgba(255,162,31,.15);
  --glass:rgba(18,18,20,.74); --scrim:rgba(0,0,0,.55);
  --shadow:0 0 0 .5px rgba(255,255,255,.04); --shadow-lg:0 24px 80px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.press{transition:transform .18s var(--ease),opacity .18s}
.press:active{transform:scale(.97);opacity:.85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(104px + env(safe-area-inset-bottom,0px));max-width:1180px}
.side{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:.5px solid var(--sep);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10.5px;font-weight:500;color:var(--fg2);text-decoration:none;letter-spacing:.01em}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}
.tab-add{justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);margin-top:-14px}
.tab-add svg{width:26px;height:26px}

@media (min-width:900px){
  body::before{display:none}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:fixed;top:0;bottom:0;left:0;width:256px;z-index:20;
    padding:calc(28px + env(safe-area-inset-top,0px)) 16px 24px max(16px,env(safe-area-inset-left,0px));border-right:.5px solid var(--sep);background:var(--glass);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
  .main{margin-left:256px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:max(44px,env(safe-area-inset-right,0px));padding-block:34px 56px}
}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:650;font-size:17px;letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#7B5CFF));display:grid;place-items:center;color:#fff}
.brand-mark svg{width:18px;height:18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a svg{width:21px;height:21px;color:var(--fg2)}
.nav a:hover{background:var(--fill2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.side-add{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.side-add svg{width:18px;height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;font-size:12.5px;color:var(--fg2);padding:0 8px}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--fill);font-size:11px;font-weight:600;color:var(--fg2)}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.sync[data-s="cloud"] i{background:var(--green)}
.sync[data-s="slow"] i,.sync[data-s="error"] i{background:var(--orange)}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;margin-bottom:14px}
.ph-t{min-width:0}
.eyebrow{font-size:13px;color:var(--fg2);font-weight:500;margin:0 0 2px}
h1{font-size:34px;line-height:1.08;letter-spacing:-.025em;font-weight:750;margin:0;text-wrap:balance}
@media (min-width:900px){h1{font-size:32px}}
.ph-tools{display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--fg)}
.icon-btn svg{width:20px;height:20px}

.periodbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px)) 10px;background:linear-gradient(var(--bg) 70%,transparent)}
@media (min-width:900px){.periodbar{position:static;margin:0;padding:0;background:none;width:360px}}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;height:34px}
.seg-ind{position:absolute;top:2px;bottom:2px;left:2px;border-radius:8px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04);transition:transform .38s var(--ease)}
:root[data-theme="dark"] .seg-ind{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg-ind{background:#636366}}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:550;color:var(--fg);border-radius:8px}
.seg button[aria-pressed="true"]{font-weight:650}

/* ---------- cards & grid ---------- */
.grid{display:grid;gap:14px}
@media (min-width:900px){.grid.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}.span2{grid-column:1/-1}}
.col{display:grid;gap:14px;min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0}
.link{color:var(--accent);font-weight:550;font-size:14px;text-decoration:none;white-space:nowrap}
.muted{color:var(--fg2)}
.small{font-size:13px}

.hero{padding:22px 20px 20px}
.hero-l{font-size:14px;font-weight:550;color:var(--fg2);display:flex;align-items:center;gap:8px}
.big{font-family:var(--font-round);font-size:52px;line-height:1.02;font-weight:700;letter-spacing:-.035em;margin:8px 0 4px;white-space:nowrap}
.big small{font-size:.5em;letter-spacing:-.01em;color:var(--fg2);font-weight:650}
@media (max-width:380px){.big{font-size:44px}}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--orange-soft);color:var(--orange)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin:18px 0 12px;background:var(--fill2)}
.split span{display:block;height:100%;transition:flex-grow .5s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--fg2)}
.legend b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 13px;min-width:0}
.kpi-l{font-size:12.5px;color:var(--fg2);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font-family:var(--font-round);font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.kpi-v{font-size:18px}}

.swap{animation:swap .42s var(--ease)}
@keyframes swap{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* provision banner */
.save-card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.save-ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.save-ic svg{width:24px;height:24px}
.save-card .grow{flex:1;min-width:0}
.save-card strong{font-size:16px;font-weight:650}
.chev{width:18px;height:18px;color:var(--fg3);flex:none}

/* donut */
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:440px){.donut-wrap{grid-template-columns:1fr}.donut{margin:0 auto}}
.donut{position:relative;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{transition:stroke-dasharray .6s var(--ease),stroke-dashoffset .6s var(--ease)}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut-c b{display:block;font-family:var(--font-round);font-size:19px;font-weight:700;letter-spacing:-.02em}
.donut-c span{font-size:11.5px;color:var(--fg2)}
.cats{display:flex;flex-direction:column;gap:9px;min-width:0}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.catrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .pc{color:var(--fg2);font-size:12.5px;margin-left:6px}

/* lists (iOS inset grouped) */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;width:100%;text-align:left;position:relative}
button.row:hover{background:var(--fill2)}
.row+.row::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--sep)}
.row .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-weight:600;white-space:nowrap}
.row .v small{display:block;font-size:12px;font-weight:500;color:var(--fg2)}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.tile svg{width:19px;height:19px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:20px 4px 7px;font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.group-h span:last-child{text-transform:none;letter-spacing:0;font-weight:600}
.date-chip{width:40px;flex:none;text-align:center;line-height:1.05;border-radius:10px;background:var(--fill2);padding:5px 0}
.date-chip b{display:block;font-size:16px;font-weight:700}
.date-chip span{font-size:10.5px;text-transform:uppercase;color:var(--fg2);font-weight:600;letter-spacing:.04em}

.totalbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 2px}
.totalbar .big{font-size:40px;margin:0}

/* échéancier */
.bars{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:210px;align-items:end;padding-top:20px}
.bar{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;cursor:pointer;border-radius:8px}
.bar i{display:block;width:100%;max-width:34px;border-radius:7px 7px 4px 4px;background:color-mix(in srgb,var(--accent) 30%,var(--fill));transition:height .5s var(--ease),background .2s}
.bar.peak i{background:color-mix(in srgb,var(--orange) 75%,transparent)}
.bar[aria-pressed="true"] i{background:var(--accent)}
.bar.peak[aria-pressed="true"] i{background:var(--orange)}
.bar span{font-size:11px;color:var(--fg2);font-weight:550;height:14px}
.avgline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--fg3);pointer-events:none}
.avgline em{position:absolute;right:0;top:-19px;font-style:normal;font-size:11px;font-weight:600;color:var(--fg2);background:var(--card);padding:0 4px;border-radius:4px}
.bars-wrap{position:relative;padding-bottom:20px}

/* provisions */
.pgrid{display:grid;gap:12px}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pcard{display:flex;flex-direction:column;gap:12px}
.pcard-h{display:flex;gap:12px;align-items:center}
.pcard-h .grow{flex:1;min-width:0}
.pcard-h .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.prog span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .6s var(--ease)}
.prog.good span{background:var(--green)}
.prog-l{display:flex;justify-content:space-between;font-size:13px;color:var(--fg2)}
.prog-l b{color:var(--fg);font-weight:600}
.pacts{display:grid;grid-template-columns:1fr auto;gap:8px}
.btn{height:40px;border-radius:12px;padding:0 14px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%;height:50px;border-radius:14px;font-size:16px}
.btn svg{width:17px;height:17px}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--fg);font-size:13.5px;margin-bottom:14px}
.banner .btn{height:32px;font-size:13px;border-radius:9px}

.empty{text-align:center;padding:40px 20px}
.empty .save-ic{margin:0 auto 14px;width:56px;height:56px;border-radius:16px}
.empty h2{font-size:20px;margin:0 0 6px}
.empty p{color:var(--fg2);margin:0 auto 18px;max-width:34ch}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(100dvh - 12px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .46s var(--ease);box-shadow:var(--shadow-lg)}
.sheet.on{transform:none}
.sheet-h{flex:none;padding:8px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));touch-action:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fg3);margin:0 auto 8px}
.sheet-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.sheet-top h3{margin:0;font-size:17px;font-weight:650;text-align:center}
.sheet-top .l{justify-self:start;color:var(--accent);font-size:16px}
.sheet-top .r{justify-self:end;color:var(--accent);font-size:16px;font-weight:650}
.sheet-top .r:disabled{color:var(--fg3)}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:540px;border-radius:24px;max-height:min(860px,calc(100dvh - 48px));transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .36s var(--ease),opacity .25s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
  .sheet-h{padding:16px 20px 6px}
  .sheet-b{padding:8px 20px 22px}
}
.sheet-b>*{flex-shrink:0}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 2px}
.amount input{font-family:var(--font-round);font-size:52px;font-weight:700;letter-spacing:-.035em;border:0;background:transparent;text-align:right;width:6.2ch;min-width:2ch;padding:0;outline:none;color:var(--fg)}
.amount input::placeholder{color:var(--fg3)}
.amount span{font-family:var(--font-round);font-size:34px;font-weight:650;color:var(--fg2)}
.conv{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:26px}
.conv .pill{background:var(--card);color:var(--fg2);box-shadow:var(--shadow);font-weight:550}
.conv .pill b{color:var(--fg);font-weight:650}
.field{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}

/** Next occurrence on or after `from` (default today). */
/** Date de fin des paiements (crédit, location…), ou null si sans fin. */
const endDate = l => (l.freq!=='once' && l.end) ? parseDate(l.end) : null;
/** Une ligne est active tant que sa date de fin n'est pas passée. */
const isActive = (l, at = today0()) => { const e = endDate(l); return !e || e >= at; };
function nextDue(l, from = today0()){
  const d = parseDate(l.due); if(!d) return null;
  if(l.freq==='once') return d;
  const e = endDate(l); let r;
  if(l.freq==='weekly'){ r = new Date(d); while(r < from) r.setDate(r.getDate()+7); }
  else { const k = FREQ[l.freq].months; let i = 0; r = d; while(r < from && i++ < 600) r = addMonths(d, k*i); }
  return e && r > e ? null : r;
}
/** Paiements restants jusqu'à la date de fin : nombre et montant. */
function remaining(l){
  const e = endDate(l); if(!e) return null;
  const t = today0(); if(e < t) return { count:0, total:0 };
  let count;
  const first = nextDue(l, t) || (l.due ? null : t);
  if(!first) return { count:0, total:0 };
  if(l.freq==='weekly') count = Math.floor(daysBetween(first, e) / 7) + 1;
  else { const k = FREQ[l.freq].months; count = 0; let r = first, i = 0; while(r <= e && i < 1200){ count++; i++; r = addMonths(first, k*i); } }
  return { count, total: count * (+l.amount || 0) };
}
/** Occurrences of a line falling inside [start,end). Weekly/undated monthly lines are spread evenly. */
function occurrences(l, start, end){
  const out = [];
  if(l.freq==='weekly'){ return null; }
  const d = parseDate(l.due);
  if(l.freq==='once'){ if(d && d>=start && d<end) out.push(d); return out; }
  const k = FREQ[l.freq].months;
  if(!d){ if(k===1) return null; return out; }
  let i = 0, r = d;
  while(r >= start && i > -600){ i--; r = addMonths(d, k*i); }
  while(r < start && i < 600){ i++; r = addMonths(d, k*i); }
  while(r < end && i < 600){ out.push(r); i++; r = addMonths(d, k*i); }
  const e = endDate(l);
  return e ? out.filter(x => x <= e) : out;
}
function provisionState(l){
  const due = nextDue(l); const amount = +l.amount||0; const saved = Math.max(0, +l.saved||0);
  const days = due ? Math.max(0, daysBetween(today0(), due)) : null;
  const monthsLeft = days==null ? 12 : Math.max(1, Math.ceil(days/30.44));
  const remaining = Math.max(0, amount - saved);
  const needed = remaining / monthsLeft;
  const smooth = l.freq==='once' ? needed : yearlyRaw(l)/12;
  let expected = null;
  if(l.freq!=='once' && due){ const span = FREQ[l.freq].months*30.44; expected = amount * Math.min(1, Math.max(0, 1 - days/span)); }
  const ready = saved >= amount - 0.005;
  const status = ready ? 'ready' : expected==null ? 'neutral' : (saved + 1 >= expected ? 'ok' : 'late');
  return {due, days, monthsLeft, saved, amount, remaining, needed, smooth, expected, status, pct: amount ? Math.min(1, saved/amount) : 0};
}

}

    await S.setDoc(S.doc(F.db, 'invites', code), { hid: state.hid, createdBy: state.user.uid, createdAt: S.serverTimestamp(), expiresAt: S.Timestamp.fromMillis(expires), usedBy: null });
    return { code, expires };
  }
};

/* ================= derived ================= */
function totals(p = state.period, sc = scopeNow()){
  const L = state.lines.filter(l => inScope(l, sc));
  const inc = L.filter(l=>l.kind==='income'); const exp = L.filter(l=>l.kind==='expense');
  const income = sum(inc, l=>perPeriod(l,p,sc));
  const savings = sum(exp.filter(l=>l.cat==='epargne'), l=>perPeriod(l,p,sc));
  const spend = sum(exp.filter(l=>l.cat!=='epargne'), l=>perPeriod(l,p,sc));
  const provisions = sum(exp.filter(isProvision), l=>perPeriod(l,p,sc));
  const free = income - spend - savings;
  return {income, spend, savings, provisions, free, rate: income ? savings/income : 0};
}
function byCat(kind, p = state.period){
  const m = new Map();
  state.lines.filter(l=>l.kind===kind && inScope(l)).forEach(l => { const k = CATS[l.cat] ? l.cat : (kind==='income'?'autres':'divers'); m.set(k, (m.get(k)||0) + perPeriod(l,p)); });
  return [...m.entries()].map(([id,v])=>({id,v,c:CATS[id]})).sort((a,b)=>b.v-a.v);
}
function upcoming(n=6){
  const t = today0();
  return state.lines.filter(l=>inScope(l)).map(l=>({l, d: nextDue(l, t)})).filter(x=>x.d && x.l.freq!=='weekly')
    .sort((a,b)=>a.d-b.d || b.l.amount-a.l.amount).slice(0,n);
}
function timeline(){
  const t = today0(); const start = new Date(t.getFullYear(), t.getMonth(), 1);
  const months = Array.from({length:12}, (_,i) => ({ start: addMonths(start,i), end: addMonths(start,i+1), out:0, inc:0, items:[], incItems:[] }));
  state.lines.filter(l => inScope(l)).forEach(l => {
    const f = shareOf(l);
    months.forEach(m => {
      const occ = occurrences(l, m.start, m.end);
      const add = (amt, date) => { if(l.kind==='expense'){ m.out += amt; m.items.push({l, amt, date}); } else { m.inc += amt; m.incItems.push({l, amt, date}); } };
      const e = endDate(l);
      if(occ===null){ if(!e || m.start <= e) add(yearly(l)/12, null); }
      else occ.forEach(d => add((+l.amount||0) * f, d));
    });
  });
  return months;
}

function viewTimeline(){
  const tl = timeline(); const avg = sum(tl,m=>m.out)/12; const max = Math.max(...tl.map(m=>Math.max(m.out, m.inc)), avg)*1.08 || 1;
  const sel = Math.min(11, Math.max(0, state.month)); const m = tl[sel];
  const byDate = (a,b)=> (a.date? a.date-0 : 9e15) - (b.date? b.date-0 : 9e15);
  const items = [...m.items].sort(byDate);
  const dated = items.filter(i=>i.date); const spread = items.filter(i=>!i.date);
  const incs = [...m.incItems].sort(byDate);
  const peaks = tl.filter(x=>x.out > avg*1.15).length;

/** Photo choisie : recadrée en carré, réduite à 192 px, JPEG (~15 Ko) pour tenir dans le foyer. */
async function resizePhoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const S = 192, c = document.createElement('canvas'); c.width = c.height = S;
    const side = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - side)/2, sy = (img.naturalHeight - side)/2;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, sx, sy, side, side, 0, 0, S, S);
    let q = .85, out = c.toDataURL('image/jpeg', q);
    while(out.length > 70000 && q > .4){ q -= .15; out = c.toDataURL('image/jpeg', q); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

    : {id: uid(), kind: kind || (state.route==='budget'?state.budgetKind:'expense'), label:'', amountStr:'', freq:'monthly', cat:'', catTouched:false, due:'', saved:0, pro: state.scope==='pro' && hasPro() ? 100 : 0, confirm:false, isNew:true};
  sheet.pro = Math.round(+sheet.pro || 0);

  sheet.natureTouched = editing;
  const el = $('#sheet');

  el.hidden = false; $('#scrim').hidden = false;

  const r = $('#f-pro');
  if(r) r.addEventListener('input', () => { sheet.pro = +r.value; $('#f-pro-v').textContent = r.value + ' %';
    const v2 = parseAmount(sheet.amountStr), y2 = isFinite(v2) ? v2 * FREQ[sheet.freq].perYear : 0;
    if(y2) $('#f-pro-eq').textContent = `≈ ${eur(y2*sheet.pro/100)} pro et ${eur(y2*(100-sheet.pro)/100)} privé par an`; });
}
function setNature(n, touched = true){
  sheet.nature = n; if(touched) sheet.natureTouched = true;
  sheet.pro = n==='private' ? 0 : n==='pro' ? 100 : (sheet.pro > 0 && sheet.pro < 100 ? sheet.pro : 50);
  sheetNature();
}
function sheetCats(){
  const s = sheet; const ids = Object.keys(CATS).filter(k=>CATS[k].kind===s.kind);
  $('#f-cats').innerHTML = ids.map(k=>`<button class="chip cat press" data-cat="${k}" aria-pressed="${s.cat===k}">${tile(k)}${CATS[k].label}</button>`).join('');
  $('#f-sugg').textContent = (!s.catTouched && s.cat) ? '· suggérée' : '';
  if(!s.natureTouched && CATS[s.cat]?.pro && s.nature!=='pro') setNature('pro', false);
  else if(!s.natureTouched && s.nature==='pro' && !CATS[s.cat]?.pro && s.pro===100 && !(state.scope==='pro' && hasPro())) setNature('private', false);
}
function sheetDates(){
  const s = sheet; const prov = s.kind==='expense' && (s.freq==='once' || (FREQ[s.freq].months||0)>=2);
  const lab = s.freq==='once' ? 'Date prévue' : s.freq==='weekly' ? 'Premier paiement' : 'Prochaine échéance';
  $('#f-dates').innerHTML = `<div class="frow"><span>${lab}</span><input type="date" id="f-due" value="${esc(s.due||'')}"></div>
    ${s.freq!=='once' ? `<div class="frow"><span>Fin des paiements</span><input type="date" id="f-end" value="${esc(s.end||'')}" aria-describedby="f-end-info"></div>` : ''}
    ${prov?`<div class="frow"><span>Déjà mis de côté</span><input id="f-saved" inputmode="decimal" placeholder="0 €" value="${s.saved? esc(String(s.saved).replace('.',',')) : ''}"></div>`:''}`;
  const hint = $('#f-hint'); if(hint) hint.remove();
  const ei = $('#f-end-info'); if(ei) ei.remove();
  $('#f-dates').insertAdjacentHTML('afterend', `<p class="hint" id="f-hint">${prov ? 'Une provision sera créée : l\'appli calcule combien mettre de côté chaque mois pour être prêt à l\'échéance.' : s.freq==='weekly' ? 'Les dépenses hebdomadaires sont converties sur 52 semaines par an.' : 'La date est facultative. Elle sert à l\'échéancier.'}</p>`);
  $('#f-dates').insertAdjacentHTML('afterend', `<p class="hint" id="f-end-info" style="margin-top:-8px"></p>`);
  const due = $('#f-due'); due.addEventListener('change', ()=>{ sheet.due = due.value; sheetEndInfo(); });
  const en = $('#f-end'); if(en) en.addEventListener('change', ()=>{ sheet.end = en.value; sheetEndInfo(); });
  sheetEndInfo();
  const sv = $('#f-saved'); if(sv) sv.addEventListener('input', ()=>{ const v = parseAmount(sv.value); sheet.saved = isFinite(v)? v : 0; });
}
function sheetEndInfo(){
  const el = $('#f-end-info'); if(!el || !sheet) return;
  const s = sheet, v = parseAmount(s.amountStr);
  if(s.freq==='once'){ el.textContent = ''; return; }
  if(!s.end){ el.textContent = 'Fin des paiements : facultative. Pour un crédit, un leasing ou une location, indique la date du dernier paiement.'; return; }
  if(s.due && s.end < s.due){ el.innerHTML = '<span style="color:var(--red)">La fin des paiements est avant la prochaine échéance.</span>'; return; }
  const r = remaining({ freq:s.freq, due:s.due, end:s.end, amount: isFinite(v) ? v : 0 });
  const e = parseDate(s.end);
  el.textContent = e < today0() ? `Paiements terminés en ${monthYear(e)} : la ligne ne compte plus dans le budget.`
    : r && r.count ? `${r.count} paiement${r.count>1?'s':''} restant${r.count>1?'s':''} jusqu'en ${monthYear(e)}${isFinite(v) && v>0 ? `, soit ${eur(r.total)} au total` : ''}.` : `Dernier paiement en ${monthYear(e)}.`;
}
function sheetConv(){
  const s = sheet; const v = parseAmount(s.amountStr); const el = $('#f-conv');
  if(!isFinite(v) || v<=0){ el.innerHTML = `<span class="muted small">Saisis le montant tel qu'il est payé : l'appli le convertit.</span>`; $('#f-save').disabled = true; return; }
  const y = v * FREQ[s.freq].perYear;
  const parts = [['week','/ sem.'],['month','/ mois'],['year','/ an']].filter(([p])=>!(s.freq==='weekly'&&p==='week')&&!(s.freq==='monthly'&&p==='month')&&!(s.freq==='annual'&&p==='year'));
  el.innerHTML = parts.map(([p,u])=>`<span class="pill">≈ <b class="num">${eur(y/PERIODS[p].div)}</b> ${u}</span>`).join('');
  $('#f-save').disabled = !(s.label||'').trim();
  sheetEndInfo();
  const eq = $('#f-pro-eq'); if(eq && s.nature==='mixed') eq.textContent = `≈ ${eur(y*s.pro/100)} pro et ${eur(y*(100-s.pro)/100)} privé par an`;
}
function bindSheet(){
  const a = $('#f-amount'), lab = $('#f-label');
  a.addEventListener('input', ()=>{ a.value = a.value.replace(/[^\d.,\s]/g,''); sheet.amountStr = a.value; a.style.width = Math.max(2, a.value.length+.6)+'ch'; sheetConv(); });
  a.style.width = Math.max(2, (a.value||'0').length+.6)+'ch';
  lab.addEventListener('input', ()=>{ sheet.label = lab.value; if(!sheet.catTouched){ const g = suggestCat(lab.value, sheet.kind); sheet.cat = g||''; sheetCats(); } sheetConv(); });
  [a,lab].forEach(i=>i.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); if(i===a) lab.focus(); else saveSheet(); } }));
  sheetCats(); sheetNature(); sheetDates(); sheetConv();
  // drag to dismiss (phone)
  const h = $('#sheet-drag'), el = $('#sheet'); let y0=null, dy=0;
  h.addEventListener('pointerdown', e=>{ if(window.matchMedia('(min-width:900px)').matches || e.target.closest('button')) return; y0=e.clientY; dy=0; el.style.transition='none'; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointermove', e=>{ if(y0==null) return; dy=Math.max(0,e.clientY-y0); el.style.transform=`translateY(${dy}px)`; });
  const end = ()=>{ if(y0==null) return; el.style.transition=''; y0=null; if(dy>110) closeSheet(); else el.style.transform=''; };
  h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
}
async function saveSheet(){
  const s = sheet; if(!s) return;
  const amount = parseAmount(s.amountStr);
  if(!isFinite(amount) || amount<=0){ toast('Indique un montant'); $('#f-amount').focus(); return; }
  if(!(s.label||'').trim()){ toast('Donne un nom à cette ligne'); $('#f-label').focus(); return; }
  if(s.end && s.due && s.end < s.due && s.freq!=='once'){ toast('La fin des paiements doit être après la prochaine échéance'); return; }
  const line = { id:s.id, kind:s.kind, label:s.label.trim(), amount: Math.round(amount*100)/100, freq:s.freq,
    cat: s.cat || (s.kind==='income'?'autres':'divers'), due: s.due||'', end: s.freq==='once' ? '' : (s.end||''), saved: isProvision({kind:s.kind,freq:s.freq}) ? Math.max(0, +s.saved||0) : 0,
    pro: s.nature==='private' ? 0 : s.nature==='pro' ? 100 : Math.min(95, Math.max(5, Math.round(+s.pro||50))),
    createdAt: s.createdAt || Date.now() };
  if(s.example) line.example = true;
  const isNew = s.isNew; closeSheet();
  if(await Store.save(line)) toast(isNew ? 'Ligne ajoutée' : 'Modifications enregistrées');
}

/* ================= actions ================= */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2200); }
function setPeriod(p){ if(!PERIODS[p] || p===state.period) return; state.period = p; ls.set('bf.period', p); render(); }
function route(){
  const h = location.hash.replace('#','');
  state.route = ROUTES.some(r=>r.id===h) ? h : 'accueil';
  render(); window.scrollTo({top:0});
}
document.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-act]'); if(!t) return;
  const d = t.dataset;
  if(d.period) return setPeriod(d.period);
  if(d.scope){ state.scope = d.scope; ls.set('bf.scope', d.scope); if(state.route==='accueil' && t.classList.contains('link')) window.scrollTo({top:0, behavior:'smooth'}); return render(); }
  if(d.nature && sheet){ setNature(d.nature); return; }
  if(d.kind && !d.act){ state.budgetKind = d.kind; return render(); }
  if(d.month){ state.month = +d.month; return render(); }
  if(d.edit){ const l = state.lines.find(x=>x.id===d.edit); if(l) openSheet(l); return; }
  if(d.deposit){ const l = state.lines.find(x=>x.id===d.deposit); if(!l) return; const amt = +d.amt;
    if(await Store.save({...l, saved: Math.round(((+l.saved||0)+amt)*100)/100})) toast(`${eur(amt)} mis de côté pour « ${l.label} »`); return; }
  if(d.paid){ const l = state.lines.find(x=>x.id===d.paid); if(!l) return;
    if(l.freq==='once'){ await Store.remove(l.id); toast(`« ${l.label} » payée et retirée`); return; }
    const cur = nextDue(l) || today0(); const nx = l.freq==='weekly' ? new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+7) : addMonths(cur, FREQ[l.freq].months);
    if(await Store.save({...l, due: iso(nx), saved: Math.max(0, Math.round(((+l.saved||0) - (+l.amount||0))*100)/100)})) toast(`Payée. Prochaine échéance : ${dueText(nx)}`); return; }
  if(d.freq && sheet){ sheet.freq = d.freq; document.querySelectorAll('#f-freq .chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.freq===d.freq)); sheetDates(); sheetConv(); return; }
  if(d.cat && sheet){ sheet.cat = d.cat; sheet.catTouched = true; sheetCats(); return; }
  if(d.fkind && sheet){ sheet.kind = d.fkind; $('#kind-ind').style.transform = `translateX(${d.fkind==='expense'?0:100}%)`;
    document.querySelectorAll('[data-fkind]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.fkind===d.fkind));
    if(!CATS[sheet.cat] || CATS[sheet.cat].kind!==d.fkind){ sheet.cat = suggestCat(sheet.label, d.fkind)||''; sheet.catTouched=false; }
    sheetCats(); sheetNature(); sheetDates(); return; }
  if(d.authtab){ state.authTab = d.authtab; state.formErr = ''; state.formInfo = ''; return render(); }
  switch(d.act){
    case 'reset': { const em = (state.form['a-email']||'').trim(); if(!em){ state.formErr = 'Saisis ton e-mail ci-dessus, puis touche à nouveau « Mot de passe oublié ».'; return render(); }
      try { await Store.reset(em); state.formErr=''; state.formInfo = `Un e-mail pour choisir un nouveau mot de passe a été envoyé à ${em}.`; } catch(e){ state.formErr = errMsg(e); } return render(); }
    case 'google': { state.busy = true; state.formErr = ''; render();
      try { const p = new F.A.GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' }); await F.A.signInWithPopup(F.auth, p); }
      catch(e){ console.warn('Connexion Google', e); if(!['auth/popup-closed-by-user','auth/cancelled-popup-request','auth/user-cancelled'].includes(e.code)) state.formErr = errMsg(e); }
      state.busy = false; return render(); }
    case 'photo-pick': $('#photo-input').click(); return;
    case 'photo-google': Store.saveProfile({ ...profileOf(state.user.uid), photo: Store.googlePhoto() }); toast('Photo Google utilisée'); return;
    case 'photo-remove': { const p0 = { ...profileOf(state.user.uid) }; delete p0.photo; Store.saveProfile(p0); toast('Photo retirée'); return; }
    case 'signout': await Store.signOut(); state.form = {}; state.formErr = ''; location.hash = 'accueil'; return;
    case 'reload': location.reload(); return;
    case 'invite': state.busy = true; render();
      try { state.invite = await Store.createInvite(); } catch(e){ toast(errMsg(e)); } state.busy = false; return render();
    case 'copy-code': { const c = fmtCode(state.invite.code);
      try { await navigator.clipboard.writeText(c); toast('Code copié'); } catch { const el = $('#invite-code'); const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Code sélectionné, copie-le'); } return; }
    case 'share-code': { const c = fmtCode(state.invite.code);
      try { await navigator.share({ title:'Budget du Foyer', text:`Rejoins notre budget « ${state.meta.name} » sur Budget du Foyer. Crée ton compte, choisis « Rejoindre un foyer » et saisis le code ${c}`, url: location.origin + location.pathname }); } catch {} return; }
    case 'new': return openSheet(null, d.kind);
    case 'close': return closeSheet();
    case 'save': return saveSheet();
    case 'del-ask': sheet.confirm = true; $('#f-del').innerHTML = delHTML(); return;
    case 'del-no': sheet.confirm = false; $('#f-del').innerHTML = delHTML(); return;
    case 'del-yes': { const id = sheet.id, name = sheet.label; closeSheet(); if(await Store.remove(id)) toast(`« ${name} » supprimée`); return; }
    case 'clear-ask': state.confirmClear = true; return render();
    case 'clear-cancel': state.confirmClear = false; return render();
    case 'clear-yes': { state.confirmClear = false; const ex = state.lines.filter(l=>l.example);
      await Store.bulkRemove(ex.map(l=>l.id));
      toast('Exemples effacés. À toi de jouer !'); return; }
    case 'template': { const add = TEMPLATE.map(t=>({id:uid(), saved:0, example:true, ...t, createdAt:Date.now()}));
      await Store.bulkSave(add);
      toast('Budget type chargé, adapte-le à ta famille'); return; }
  }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('input', e => { const el = e.target; if(el.id && /^(a|o|h)-/.test(el.id)) state.form[el.id] = el.type==='checkbox' ? el.checked : el.value; });
document.addEventListener('change', async e => {
  if(e.target.id !== 'photo-input' || !e.target.files || !e.target.files[0]) return;
  const file = e.target.files[0]; e.target.value = '';
  if(!state.user || !state.hid) return;
  try { const photo = await resizePhoto(file); Store.saveProfile({ ...profileOf(state.user.uid), photo }); toast('Photo enregistrée'); }
  catch { toast("Cette image n'a pas pu être lue. Essaie une photo JPEG ou PNG."); }
});
document.addEventListener('change', e => { const el = e.target; if(el.id && /^(a|o|h)-/.test(el.id)) state.form[el.id] = el.type==='checkbox' ? el.checked : el.value; });
document.addEventListener('submit', async e => {
  const form = e.target; if(!['auth-form','create-form','join-form','name-form','profile-form'].includes(form.id)) return;
  e.preventDefault(); if(state.busy) return;
  const f = state.form; state.formErr = ''; state.formInfo = '';
  const run = async fn => { state.busy = true; render(); try { await fn(); } catch(err){ console.warn(err); state.formErr = errMsg(err); } state.busy = false; render(); };
  if(form.id==='auth-form'){
    const em = ($('#a-email').value||'').trim(), pw = $('#a-pw').value||''; f['a-email'] = em; f['a-pw'] = pw;
    if(!em || !pw){ state.formErr = 'Saisis ton e-mail et ton mot de passe.'; return render(); }
    await run(async () => { if((state.authTab||'in')==='up') await Store.signUp(em, pw); else await Store.signIn(em, pw); f['a-pw'] = ''; });
  }
  if(form.id==='create-form'){
    const name = ($('#o-name').value||'').trim() || 'Notre foyer';
    const imp = $('#o-import') ? $('#o-import').checked : false;
    await run(async () => { await Store.createHousehold(name.slice(0,40), imp ? localImportable() : []); state.form = {}; toast(`Foyer « ${name} » créé`); });
  }
  if(form.id==='join-form'){
    const code = ($('#o-code').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(code.length !== 8){ state.formErr = errMsg({code:'join/format'}); return render(); }
    await run(async () => { await Store.joinHousehold(code); state.form = {}; toast('Bienvenue dans le foyer'); });
  }
  if(form.id==='profile-form'){
    const name = ($('#h-pname').value||'').trim(); delete f['h-pname']; $('#h-pname').blur();
    Store.saveProfile({ ...profileOf(state.user.uid), name }); toast('Profil enregistré'); return;
  }
  if(form.id==='name-form'){
    const name = ($('#h-name').value||'').trim(); if(!name) return;
    delete f['h-name']; $('#h-name').blur(); await Store.saveMeta({ name: name.slice(0,40) }); toast('Nom enregistré');
  }
});
document.addEventListener('keydown', e => {
  if(sheet){ if(e.key==='Escape') closeSheet(); return; }
  if(e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey || document.body.classList.contains('gate')) return;
  const k = e.key.toUpperCase();
  if(k==='N'){ e.preventDefault(); openSheet(); return; }
  const p = PKEYS.find(x=>PERIODS[x].key===k); if(p) setPeriod(p);
});
let mqDesk = window.matchMedia('(min-width:900px)'); mqDesk.addEventListener?.('change', ()=>render());
window.addEventListener('hashchange', route);

/* PWA: offline + installable when served from its own host */
if('serviceWorker' in navigator && location.protocol==='https:' && !IN_CLAUDE){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

route();
Store.init();
</script>
